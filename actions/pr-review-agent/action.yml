name: PR Review Agent
description: AI PR review for Angular/NX

inputs:
  github-token:
    required: true
    default: ${{ github.token }}

  openai-api-key:
    required: true

runs: 
  using: composite 
  steps: 
    - name: Install dependencies 
      run: npm ci --omit=dev
      shell: bash 
      working-directory: ${{ github.action_path }}

    - name: Show projects 
      run: npx nx show projects 
      shell: bash 
      working-directory: ${{ github.action_path }}
      
    # - name: Build action 
    #   run: npx nx build pr-review-agent-runner 
    #   shell: bash 
    #   working-directory: ${{ github.action_path }} 

    - name: Run action 
      run: node dist/main.js 
      shell: bash 
      working-directory: ${{ github.action_path }}
      env: 
        OPENAI_API_KEY: ${{ inputs.openai-api-key }} 
        GITHUB_TOKEN: ${{ inputs.github-token }} 
      
