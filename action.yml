name: PR Review Agent
description: AI PR review for Angular/NX

inputs:
  github-token:
    required: true
    default: ${{ github.token }}

  openai-api-key:
    required: true
    
runs:
  using: composite
  steps:
    - run: npm ci
      shell: bash

    - run: npx nx build pr-review-agent-runner
      shell: bash

    - run: node dist/apps/pr-review-agent-runner/main.js
      shell: bash
